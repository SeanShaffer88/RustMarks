name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify CI diagnostic runner
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Format
        run: python scripts/ci.py format cargo fmt --check
      - name: Test
        run: python scripts/ci.py test cargo test --all-targets
      - name: Clippy
        run: python scripts/ci.py clippy cargo clippy --all-targets
      - name: Release build
        run: python scripts/ci.py release cargo build --release
      - name: Retain diagnostics even when a gate fails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: RustMarks-CI-diagnostics
          path: |
            artifacts/*.log
            Cargo.lock
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: RustMarks-Windows
          path: target/release/rustmarks.exe
