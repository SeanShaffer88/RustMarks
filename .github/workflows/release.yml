name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/build-installers.ps1 -Version $v.TrimStart("v") -OutDir dist
          $name = "RustMarks-$v-x64-Portable"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          Copy-Item target/release/rustmarks.exe dist/$name/
          Copy-Item README.md, LICENSE, CHANGELOG.md, CREDITS.md dist/$name/
          Set-Content -Path dist/$name/portable.txt -Value "Portable mode: data is stored in the data folder next to rustmarks.exe. Delete this file to use %APPDATA% instead."
          Compress-Archive -Path dist/$name/* -DestinationPath "dist/$name.zip"
          Set-Location dist
          Remove-Item *.msi -ErrorAction SilentlyContinue
          $hashLines = Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" -and $_.Extension -ne ".wixpdb" } | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" }
          $hashLines | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*-Setup.exe dist/SHA256SUMS.txt --title "RustMarks ${{ github.ref_name }}" --notes-file CHANGELOG.md
