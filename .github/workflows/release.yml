name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          $name = "RustMarks-$v-x64"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          Copy-Item target/release/rustmarks.exe dist/$name/
          Copy-Item README.md, LICENSE, CHANGELOG.md, CREDITS.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath "dist/$name.zip"
          Copy-Item target/release/rustmarks.exe "dist/$name.exe"
          Set-Location dist
          Get-ChildItem -File | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.exe dist/SHA256SUMS.txt --title "RustMarks ${{ github.ref_name }}" --notes-file CHANGELOG.md
