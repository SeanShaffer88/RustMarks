[package]
name = "rustmarks"
version = "1.0.0"
edition = "2021"
description = "Offline-first native bookmark studio"
license = "MIT"

[dependencies]
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.19"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
rfd = "0.14"
flate2 = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif"] }

[profile.release]
lto = true
strip = true
